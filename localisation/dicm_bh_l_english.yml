 dicm_bh_resource_note:0 "\nRanks by additional maximum manpower or sailors, including flat local bonuses and autonomy. Upgrades count only the additional benefit over the existing tier. Conditional completion rewards and special ship availability do not affect the ranking. Normal construction still applies completion effects."

 dicm_bh_force_note:0 "\nRanks by additional national force limit after autonomy and national force-limit modifiers, retaining fractions. Upgrades count only the gain beyond the existing tier. Shipbuilding speed, repair bonuses and conditional completion rewards do not affect the ranking. Normal construction still applies completion effects."
 dicm_bh_unit_coastal:0 "Min. priority"
 dicm_bh_unit_help_coastal:0 "Strategic priority, from highest to lowest: 5 - valuable recently raided coast without existing raid protection; 4 - coastal capitals and fortified islands or isolated strongholds; 3 - other coastal forts; 2 - rich ports, centres of trade and estuaries; 1 - other coast. Development breaks ties within a priority. Rich means at least 20 development. Zero allows every priority; a minimum above 5 excludes all sites. Both increment buttons change the minimum by 1."
 dicm_bh_coastal_note:0 "\n\nCoastal defences use strategic priority, then development. Recent raids indicate exposure; future raider range and diplomacy are not predicted. Upgrades do not gain priority for raid immunity already provided by Coastal Defence. Adjacent coastal defences are allowed."
 dicm_bh_name_wharf:0 "Naval Equipment Manufactory"
 dicm_bh_select_wharf_tt:0 "Select Naval Equipment Manufactory."
 dicm_bh_name_plantations:0 "Plantations"
 dicm_bh_select_plantations_tt:0 "Select Plantations."
 dicm_bh_name_mills:0 "Mills"
 dicm_bh_select_mills_tt:0 "Select Mills."
 dicm_bh_name_ramparts:0 "Ramparts"
 dicm_bh_select_ramparts_tt:0 "Select Ramparts."
 dicm_bh_unit_ramparts:0 "Min. fort priority"
 dicm_bh_unit_help_ramparts:0 "Ramparts require a completed land fort and an empty manufactory slot. Priority is 2, 4, 6 or 8 for the four fort tiers, plus 1 on a land border. Higher tiers are processed first, with border forts first within a tier. Zero allows all eligible fort sites."
 dicm_bh_manufactory_note:0 "\n\nManufactories use an empty manufactory slot; existing manufactories, State Houses and Ramparts are never replaced. No upgrades. Goods buildings rank added monthly production income, excluding trade income. Gold and trade-company production are not estimated. Furnaces use the national monthly production gain across supported provinces. Soldier's Households and Impressment Offices rank additional maximum manpower and sailors, including trade-good bonuses, current resource modifiers and autonomy. Ramparts use fort priority. Estimates exclude conditional EE completion rewards; native construction applies those rewards on completion."
