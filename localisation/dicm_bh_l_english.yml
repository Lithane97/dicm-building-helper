 dicm_bh_production_estimate_note:0 "\nProduction gains use current monthly income, with an approximate fallback when unavailable. Trade-company provinces are not included yet."
 dicm_bh_production_estimate_note_none:0 ""
 dicm_bh_production_income_sample:0 "Current province production income"
 dicm_bh_fort_note:0 "\nBorder forts are processed first, then inland forts. Within each group, sites are ordered by adjacent land-province count, regardless of owner. Border provinces (land borders with another country) may build next to an inland fort of your country. Border-to-border and inland placements retain the spacing restriction for your own forts, including forts queued by this helper and planned sites in each estimate. Foreign forts do not block placement. Upgrades retain existing locations, including adjacent forts. Construction costs exclude ongoing maintenance."
 dicm_bh_fort_note_none:0 ""
 dicm_bh_administration_note:0 "\nRanked by additional governing capacity saved. Fractional savings count toward the minimum. The percentage factor has a 1% floor; flat reductions may reduce the final cost to zero. Conditional effects on completion are excluded."
 dicm_bh_state_house_note:0 "\nMinimum and ranking use total area-wide governing capacity saved across your provinces. Paper, glass and gems receive the enhanced effects. One State House is planned per area; existing manufactories and construction follow normal building rules. State Houses have no upgrade tier. Conditional effects on completion are excluded."
 dicm_bh_administration_note_none:0 ""

 dicm_bh_unit_university:0 "Overall development benefit score"
 dicm_bh_unit_help_university:0 "Equal-weight sum of ADM, DIP and MIL improvements in benefit per 100 power. Each is divided by the best eligible site in that category. Score range: 0 to 3. Unsupported categories contribute zero; a minimum above 3 excludes every site."
 dicm_bh_university_note:0 "\nUniversities rank by the combined ADM, DIP and MIL score, normalized separately against the best eligible sites before budget filtering. Minimum uses this score. Scores estimate the next-click discount benefit after completion; they do not predict future development or conditional completion bonuses. Normal construction costs and your treasury cap apply. No monarch power is spent. Universities have no upgrades."

 dicm_bh_dev_title:0 "Development Helper"
 dicm_bh_dev_intro:0 "Develop the best sites while keeping your reserves."
 dicm_bh_dev_open_tt:0 "Development Helper\nReview ADM, DIP and MIL development and set point reserves."
 dicm_bh_dev_refresh_tt:0 "Refresh development recommendations using current costs and benefits. No monarch power is spent."
 dicm_bh_dev_reserve_tt:0 "Points to keep in reserve for this power type. Adjust by 50; minimum 0. Each type remembers its own setting."
 dicm_bh_dev_preview_tt:0 "Estimated cost and marginal benefit of the best next click for this power type. Tax/production gains are annual ducats; manpower is additional maximum manpower. Refresh after development or modifier changes. Scores use benefit per 100 power and are compared within each type. Scripted development rounds the estimated devastation reduction to the nearest whole point. Estate land deductions use whole-number influence weights, so crownland gains can differ slightly from native development."
 dicm_bh_dev_spend_tt:0 "Spend this power type on supported development while keeping its reserve. The helper ranks provinces again after every increase and stops when no affordable supported click remains, a check fails, or 1,000 attempts are reached. Devastation reduction is rounded; estate land deductions use whole-number influence weights. Hover over the result below for the stop reason."
